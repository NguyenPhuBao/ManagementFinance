name: flowmoney
description: FlowMoney - Personal Finance Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.1.0

  # Navigation
  go_router: ^14.6.2

  # Dependency injection
  get_it: ^7.7.0

  # Local database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # HTTP
  dio: ^5.7.0

  # Connectivity & sync
  connectivity_plus: ^6.1.1
  uuid: ^4.5.1

  # Security
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

  # UI & fonts
  google_fonts: ^6.2.1
  intl: ^0.19.0
  font_awesome_flutter: ^11.0.0
  unorm_dart: ^0.3.2

  # Thông báo hệ điều hành (Android/iOS). Không dùng trên web —
  # flutter_local_notifications chỉ được import trong os_notifier_native.dart.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Biểu đồ (trang Phân tích, và biểu đồ tiến độ mục tiêu sau này).
  # GHIM phiên bản chính xác, không dùng `^`: fl_chart có tiếng đổi API giữa
  # các bản, và biểu đồ hỏng thì hỏng lặng lẽ — vẽ ra hình khác chứ không ném
  # lỗi. Nới ra thì phải xem lại biểu đồ trên máy thật, đừng nới rồi tin test.
  fl_chart: 1.2.0
  # Xuất báo cáo ra tệp (lát 2c-2). `pdf` dựng tài liệu, `share_plus` đưa tệp
  # ra sheet chia sẻ/lưu của hệ điều hành — cách này KHÔNG cần quyền ghi bộ
  # nhớ trên Android 10+, và người dùng tự chọn nơi lưu.
  pdf: ^3.12.0
  share_plus: ^12.0.2

  # Kênh thời gian thực. Backend chạy socket.io v4; socket_io_client 3.x nói
  # đúng giao thức ấy. KHÔNG ghim cứng như fl_chart: ở đây client chỉ dùng vài
  # API bề mặt (connect/dispose/onAny), và hỏng thì hỏng ồn ào — mất kết nối,
  # chứ không phải vẽ ra hình sai trong im lặng.
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # Font cho tệp PDF. **Bắt buộc phải nhúng**: font mặc định của gói `pdf` là
  # Helvetica, không có glyph tiếng Việt, và nó **mất dấu im lặng** — chữ vẫn
  # in ra, chỉ là "Ăn uống" thành "An uong" hoặc ô trống. Roboto (Apache 2.0)
  # phủ đủ dấu và cả ký hiệu ₫ (đã kiểm cmap trước khi nhúng).
  #
  # Không dùng `PdfGoogleFonts` của gói `printing`: nó TẢI font lúc chạy, mà
  # app này offline-first.
  fonts:
    - family: RobotoPdf
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
